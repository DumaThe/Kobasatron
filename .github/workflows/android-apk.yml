name: Build Kobasatron APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee /tmp/kobasatron-build.log
      - name: Save diagnostic log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B build-diagnostics
          cp /tmp/kobasatron-build.log build-error.log || echo "Build failed before Gradle" > build-error.log
          git add build-error.log
          git commit -m "Record Android build failure" || true
          git push --force origin build-diagnostics
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kobasatron-APK
          path: app/build/outputs/apk/debug/*.apk
